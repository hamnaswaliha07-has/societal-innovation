<title>Edit Challenge - Admin</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
    }

    .container {
        width: 92%;
        max-width: 900px;
        margin: 30px auto;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
    }

    h1 {
        margin-top: 0;
        font-size: 28px;
    }

    .field {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
        font-family: inherit;
    }

    textarea {
        min-height: 150px;
        resize: vertical;
    }

    .error {
        background: #fee2e2;
        color: #991b1b;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 18px;
    }

    .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 25px;
    }

    button,
    a {
        padding: 11px 17px;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
    }

    .save {
        background: #2563eb;
        color: white;
    }

    .back {
        background: #e5e7eb;
        color: #222;
    }

    @media (max-width: 600px) {

        .container {
            width: 95%;
            margin: 15px auto;
        }

        .card {
            padding: 17px;
        }

        h1 {
            font-size: 22px;
        }

        .buttons {
            flex-direction: column;
        }

        button,
        .buttons a {
            width: 100%;
            text-align: center;
        }
    }
</style>
```

</head>

<body>

<div class="container">

```
<div class="card">

    <h1>✏️ Edit Challenge</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}


    <form method="POST">

        <div class="field">

            <label for="title">
                Problem Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ challenge.title }}"
                required
            >

        </div>


        <div class="field">

            <label for="description">
                Problem Description
            </label>

            <textarea
                id="description"
                name="description"
                required
            >{{ challenge.description }}</textarea>

        </div>


        <div class="field">

            <label for="category">
                Category
            </label>

            <input
                type="text"
                id="category"
                name="category"
                value="{{ challenge.category }}"
                required
            >

        </div>


        <div class="field">

            <label for="priority">
                Priority
            </label>

            <select
                id="priority"
                name="priority"
                required
            >

                <option
                    value="Low"
                    {% if challenge.priority == "Low" %}selected{% endif %}
                >
                    Low
                </option>

                <option
                    value="Medium"
                    {% if challenge.priority == "Medium" %}selected{% endif %}
                >
                    Medium
                </option>

                <option
                    value="High"
                    {% if challenge.priority == "High" %}selected{% endif %}
                >
                    High
                </option>

                <option
                    value="Critical"
                    {% if challenge.priority == "Critical" %}selected{% endif %}
                >
                    Critical
                </option>

            </select>

        </div>


        <div class="field">

            <label for="district">
                District
            </label>

            <input
                type="text"
                id="district"
                name="district"
                value="{{ challenge.district }}"
                required
            >

        </div>


        <div class="field">

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                name="address"
                value="{{ challenge.address }}"
                required
            >

        </div>


        <div class="buttons">

            <button
                type="submit"
                class="save"
            >
                💾 Save Changes
            </button>

            <a
                class="back"
                href="{{ url_for('admin_view_challenge', submission_id=challenge.id) }}"
            >
                ← Cancel
            </a>

        </div>

    </form>

</div>
```

</div>

</body>
</html>
