{% extends "base.html" %}

{% block title %}
Forgot Password | Societal Innovation Portal
{% endblock %}

{% block content %}

<section style="
    min-height: 80vh;
    padding: 60px 20px;
    background: #f5f7fb;
">

    <div style="
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    ">

        <h1 style="color: #172554;">
            🔐 Forgot Password
        </h1>

        <p style="color: #64748b;">
            Enter the email address associated with your account.
        </p>


        {% if error %}

        <div style="
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin: 20px 0;
        ">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label style="
                display: block;
                font-weight: 600;
                margin-bottom: 8px;
            ">
                Email Address
            </label>

            <input
                type="email"
                name="email"
                required
                placeholder="Enter your registered email"
                style="
                    width: 100%;
                    box-sizing: border-box;
                    padding: 13px;
                    border: 1px solid #cbd5e1;
                    border-radius: 8px;
                    margin-bottom: 20px;
                "
            >


            <button
                type="submit"
                style="
                    width: 100%;
                    background: #2563eb;
                    color: white;
                    border: none;
                    padding: 14px;
                    border-radius: 8px;
                    font-size: 16px;
                    font-weight: bold;
                    cursor: pointer;
                "
            >
                Continue
            </button>

        </form>


        <div style="
            text-align: center;
            margin-top: 20px;
        ">

            <a
                href="{{ url_for('login') }}"
                style="
                    color: #2563eb;
                    text-decoration: none;
                    font-weight: 600;
                "
            >
                ← Back to Login
            </a>

        </div>

    </div>

</section>

{% endblock %}
